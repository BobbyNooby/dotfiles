# cava settings for the player's dotted visualiser (MusicPanel.qml): 10 bars, each a number
# 0..9 per line, read from PipeWire. Only runs while the player is open and music is playing.
[general]
bars = 10
framerate = 30
lower_cutoff_freq = 32
higher_cutoff_freq = 16000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 9
bar_delimiter = 59
frame_delimiter = 10

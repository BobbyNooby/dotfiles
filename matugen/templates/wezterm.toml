# Generated by matugen from the wallpaper (template: dotfiles/matugen/templates/wezterm.toml)
[colors]
foreground = "{{colors.on_surface.default.hex}}"
background = "{{colors.surface.default.hex}}"
cursor_bg = "{{colors.primary.default.hex}}"
cursor_fg = "{{colors.on_primary.default.hex}}"
cursor_border = "{{colors.primary.default.hex}}"
selection_bg = "{{colors.primary_container.default.hex}}"
selection_fg = "{{colors.on_primary_container.default.hex}}"
split = "{{colors.outline_variant.default.hex}}"
# The 16 terminal colours are FIXED (Tokyo Night Storm, the Mac's theme; same as the boot
# console in hosts/roxy/configuration.nix), not from the wallpaper. matugen's base16 palette
# is tones of the wallpaper, not real hues: with a dark red wallpaper its "green", "blue" and
# "cyan" all came out near-black on the background, so highlights (e.g. `gh auth login`'s
# selection) disappeared. Background, text, cursor, selection and tabs above still follow it.
ansi = [
  "#414868", "#f7768e", "#9ece6a", "#e0af68",
  "#7aa2f7", "#bb9af7", "#7dcfff", "#a9b1d6",
]
brights = [
  "#565f89", "#ff899d", "#b9f27c", "#ffc777",
  "#8db0ff", "#c7a9ff", "#a4daff", "#c0caf5",
]

[colors.tab_bar]
background = "{{colors.surface_container_low.default.hex}}"

[colors.tab_bar.active_tab]
bg_color = "{{colors.primary.default.hex}}"
fg_color = "{{colors.on_primary.default.hex}}"

[colors.tab_bar.inactive_tab]
bg_color = "{{colors.surface_container_low.default.hex}}"
fg_color = "{{colors.on_surface_variant.default.hex}}"

[colors.tab_bar.new_tab]
bg_color = "{{colors.surface_container_low.default.hex}}"
fg_color = "{{colors.on_surface_variant.default.hex}}"

[metadata]
name = "Matugen"

# Idle behaviour: dim → lock → screen off → suspend.
# Based on hypridle's example. https://wiki.hypr.land/Hypr-Ecosystem/hypridle

general {
    lock_cmd = ~/.config/hypr/scripts/lock                            # the Eva lock (hyprlock if the shell can't); never two
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen back on after resume
}

listener {
    timeout = 150                                # 2.5 min: dim (laptop screens)
    on-timeout = /etc/profiles/per-user/$USER/bin/brightnessctl -s set 10 # (full path: hypridle's service has a bare PATH)
    on-resume = /etc/profiles/per-user/$USER/bin/brightnessctl -r
}

listener {
    timeout = 300                                # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                 # 5.5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800                               # 30 min: suspend
    on-timeout = systemctl suspend
}

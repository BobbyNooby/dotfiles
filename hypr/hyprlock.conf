# Lock screen. https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

$font = FiraCode Nerd Font Mono

# Colours from the wallpaper: matugen writes hyprlock-colors.conf (template in
# dotfiles/matugen/templates/hyprlock.conf; the rebuild makes a default one if it's missing)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot   # blurred screenshot of your desktop
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = $surface
    outer_color = $accent $accent2 45deg
    check_color = $check
    fail_color = $fail
    font_color = $text
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = $text

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = $textDim

    position = 0, 110
    halign = center
    valign = center
}

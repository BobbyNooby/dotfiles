# Lock screen. https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

$font = FiraCode Nerd Font Mono

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot   # blurred screenshot of your desktop
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(1e1e2ecc)
    outer_color = rgba(89b4faee) rgba(cba6f7ee) 45deg
    check_color = rgba(a6e3a1ee)
    fail_color = rgba(f38ba8ee)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(205, 214, 244)

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = rgb(166, 173, 200)

    position = 0, 110
    halign = center
    valign = center
}
